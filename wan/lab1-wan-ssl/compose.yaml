services:
  # =========================================================================
  # Cluster 1
  # =========================================================================
  c1-locator1:
    image: gemfire/gemfire:10.1.9-jdk17
    container_name: c1-locator1
    networks:
      - gf-wan-network
    environment:
      - ACCEPT_TERMS=y
    ports:
      - "10334:10334"
      - "7070:7070"
    volumes:
      - ./gemfire/c1-locator1:/data
      - ./ssl:/ssl:ro
      - ./config:/config:ro
    command: >
      gfsh start locator
      --name=c1-locator1
      --dir=/data
      --port=10334
      --locators=c1-locator1[10334],c1-locator2[10335]
      --http-service-port=7070
      --security-properties-file=/config/c1-locator1-security.properties

  c1-locator2:
    image: gemfire/gemfire:10.1.9-jdk17
    container_name: c1-locator2
    networks:
      - gf-wan-network
    environment:
      - ACCEPT_TERMS=y
    ports:
      - "10335:10335"
      - "7071:7070"
    volumes:
      - ./gemfire/c1-locator2:/data
      - ./ssl:/ssl:ro
      - ./config:/config:ro
    depends_on:
      - c1-locator1
    command: >
      gfsh start locator
      --name=c1-locator2
      --dir=/data
      --port=10335
      --locators=c1-locator1[10334],c1-locator2[10335]
      --http-service-port=7070
      --security-properties-file=/config/c1-locator2-security.properties

  c1-server1:
    image: gemfire/gemfire:10.1.9-jdk17
    container_name: c1-server1
    networks:
      - gf-wan-network
    environment:
      - ACCEPT_TERMS=y
    ports:
      - "40404:40404"
      - "5101:5101"
    volumes:
      - ./gemfire/c1-server1:/data
      - ./ssl:/ssl:ro
      - ./config:/config:ro
    depends_on:
      - c1-locator1
      - c1-locator2
    command: >
      gfsh start server
      --name=c1-server1
      --dir=/data
      --server-port=40404
      --locators=c1-locator1[10334],c1-locator2[10335]
      --security-properties-file=/config/c1-server1-security.properties

