distributed-system-id=1
remote-locators=c2-locator1[20334],c2-locator2[20335]

ssl-enabled-components=all
ssl-protocols=TLSv1.3,TLSv1.2
ssl-ciphers=any
ssl-require-authentication=true

# 信任库（含 CA1 + CA2 根证书）
ssl-truststore=/ssl/truststore.p12
ssl-truststore-type=PKCS12
ssl-truststore-password=password123

# 密钥库（各节点启动时通过命令行参数或各自的 properties 文件覆盖）
ssl-keystore=/ssl/c1-locator2-keystore.p12
ssl-keystore-type=PKCS12
ssl-keystore-password=password123
